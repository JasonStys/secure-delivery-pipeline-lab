[project]
name = "secure-delivery-pipeline-lab"
version = "1.0.0"
description = "Verified release provenance, tamper rejection, and atomic lab promotion by Jason Stys"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jason Stys"}]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["delivery"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["delivery"]
